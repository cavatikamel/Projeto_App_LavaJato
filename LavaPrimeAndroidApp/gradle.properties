# LavaPrime Android - ajustes de memória para Android Studio/Gradle
# Equilibrado para máquinas com 8 GB de RAM: evita OOM sem deixar IDE + Gradle competirem demais.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
ksp.incremental=true
