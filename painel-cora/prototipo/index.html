<title>Painel Cora</title>
<meta name="description" content="Esboço funcional do Painel Cora — Departamento Pessoal | Grupo Coroa">
<style>
  :root{
    /* Identidade Cora — verde #005B4F + âmbar #FFB51B (cores oficiais da logo) */
    --fundo:#F2F7F5; --cartao:#FFFFFF; --azulGelo:#E0EEEB; --azul:#005B4F;
    --azulEscuro:#00463C; --rosaPo:#FFF0CF; --rosa:#E9A417; --texto:#22332F;
    --textoSuave:#637974; --borda:#E0EAE7; --bordaForte:#CCDBD6;
    --ambar:#FFB51B; --ambarEsc:#E09E0A;
    --cora-green:#005B4F; --cora-amber:#FFB51B;
    --sombra:0 1px 2px rgba(0,58,49,.06), 0 6px 18px rgba(0,58,49,.07);
    --sombraModal:0 12px 48px rgba(0,50,42,.22);
    --st-wait:#8A9A94; --st-liberada:#3F87A6; --st-exec:#C2911C;
    --st-validacao:#8E6FB3; --st-encerrada:#1F8F6E; --st-rejeitada:#C46A57;
    --raio:12px; --raioSm:9px;
    --fonte:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --fundo:#0C1513; --cartao:#132019; --azulGelo:#16302B; --azul:#4FB6A2;
      --azulEscuro:#6FC6B4; --rosaPo:#2E2717; --rosa:#FFC24A; --texto:#E6EFEC;
      --textoSuave:#9CB2AC; --borda:#223330; --bordaForte:#31463F;
      --ambar:#FFC24A; --ambarEsc:#FFB51B;
      --cora-green:#5FC3AE; --cora-amber:#FFC24A;
      --sombra:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.28);
      --sombraModal:0 12px 48px rgba(0,0,0,.5);
      --st-wait:#8DA096; --st-liberada:#5FA6C2; --st-exec:#D9AE4A;
      --st-validacao:#AD8FCB; --st-encerrada:#4FBE99; --st-rejeitada:#D98876;
    }
  }
  :root[data-theme="dark"]{
    --fundo:#0C1513; --cartao:#132019; --azulGelo:#16302B; --azul:#4FB6A2;
    --azulEscuro:#6FC6B4; --rosaPo:#2E2717; --rosa:#FFC24A; --texto:#E6EFEC;
    --textoSuave:#9CB2AC; --borda:#223330; --bordaForte:#31463F;
    --ambar:#FFC24A; --ambarEsc:#FFB51B;
    --cora-green:#5FC3AE; --cora-amber:#FFC24A;
    --sombra:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.28);
    --sombraModal:0 12px 48px rgba(0,0,0,.5);
    --st-wait:#8DA096; --st-liberada:#5FA6C2; --st-exec:#D9AE4A;
    --st-validacao:#AD8FCB; --st-encerrada:#4FBE99; --st-rejeitada:#D98876;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--fundo); color:var(--texto); font-family:var(--fonte);
       font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
       margin:0; display:flex; flex-direction:column; min-height:100vh;}
  h1,h2,h3,h4{margin:0; font-weight:600; text-wrap:balance}
  button{font-family:inherit; cursor:pointer}
  select,input,textarea{font-family:inherit; color:inherit}
  ::selection{background:var(--azulGelo)}

  .topbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--cartao) 88%, transparent);
    backdrop-filter:saturate(1.4) blur(8px); border-bottom:1px solid var(--borda);
    padding:6px clamp(16px,4vw,28px); display:flex; align-items:center; gap:16px; flex-wrap:wrap}
  .brand{display:flex; flex-direction:row; align-items:center; gap:12px; margin-right:auto; min-width:0}
  .brand .sub{font-size:12px; color:var(--textoSuave); letter-spacing:.3px; line-height:1.25;
    padding-left:12px; border-left:1px solid var(--borda)}
  .cora-mark, .cora-lockup{display:block; flex-shrink:0}
  .ctl{display:flex; align-items:center; gap:8px}
  .ctl label{font-size:11px; color:var(--textoSuave); text-transform:uppercase; letter-spacing:.6px}
  select.field{background:var(--cartao); border:1px solid var(--bordaForte); color:var(--texto);
    border-radius:var(--raioSm); padding:7px 10px; font-size:13px; min-width:180px}
  .iconbtn{position:relative; background:var(--cartao); border:1px solid var(--bordaForte);
    border-radius:var(--raioSm); width:38px; height:38px; font-size:16px; display:grid; place-items:center; color:var(--texto)}
  .iconbtn:hover{border-color:var(--azul)}
  .dot{position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; padding:0 5px;
    background:var(--azul); color:#fff; border-radius:9px; font-size:11px; font-weight:600;
    display:grid; place-items:center; box-shadow:0 0 0 2px var(--fundo)}
  .btn{border:1px solid transparent; border-radius:var(--raioSm); padding:8px 14px; font-size:13px;
    font-weight:600; display:inline-flex; align-items:center; gap:7px; background:var(--cartao); color:var(--texto)}
  .btn.primary{background:var(--azul); color:#fff}
  .btn.primary:hover{background:var(--azulEscuro)}
  .btn.ghost{border-color:var(--bordaForte)}
  .btn.ghost:hover{border-color:var(--azul); color:var(--azul)}
  .btn.subtle{background:transparent; color:var(--textoSuave); padding:6px 8px}
  .btn.subtle:hover{color:var(--azul)}
  .btn.danger{background:color-mix(in srgb,var(--st-rejeitada) 16%,var(--cartao)); color:var(--st-rejeitada);
    border-color:color-mix(in srgb,var(--st-rejeitada) 40%,transparent)}
  .btn.danger:hover{background:color-mix(in srgb,var(--st-rejeitada) 26%,var(--cartao))}
  .btn.sm{padding:5px 10px; font-size:12px}
  .btn:disabled{opacity:.45; cursor:not-allowed}

  main{padding:10px clamp(16px,3vw,26px) 8px; max-width:1400px; margin:0 auto; width:100%;
    flex:1; min-height:0; display:flex; flex-direction:column}
  .board-head{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:8px; flex-wrap:wrap}
  .board-head h2{font-size:16px}
  .board-head p{color:var(--textoSuave); font-size:13px; margin-top:3px}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--textoSuave)}
  .legend span{display:inline-flex; align-items:center; gap:5px}

  .matrix-wrap{flex:1; min-height:0; overflow:auto; border:1px solid var(--borda); border-radius:var(--raio);
    background:var(--cartao); box-shadow:var(--sombra)}
  table.matrix{border-collapse:separate; border-spacing:0; width:100%; min-width:760px}
  table.matrix th, table.matrix td{border-bottom:1px solid var(--borda); border-right:1px solid var(--borda);
    vertical-align:top; text-align:left}
  table.matrix thead th{position:sticky; top:0; z-index:5; background:var(--azulGelo); color:var(--texto);
    padding:11px 12px; font-size:12.5px; font-weight:600}
  table.matrix thead th .fx{font-size:11px; color:var(--textoSuave); font-weight:500; display:block}
  th.corner, td.rowhead{position:sticky; left:0; z-index:6; background:var(--cartao); min-width:190px; max-width:230px}
  thead th.corner{z-index:8; background:var(--azulGelo)}
  td.rowhead{padding:0; box-shadow:1px 0 0 var(--borda)}
  td.rowhead button.rowbtn{display:block; width:100%; text-align:left; background:none; border:none; color:inherit; padding:12px}
  td.rowhead button.rowbtn:hover{background:var(--fundo)}
  td.rowhead .tname{font-weight:600; font-size:13.5px; line-height:1.3}
  td.rowhead .tsub{font-size:12px; color:var(--textoSuave); margin-top:1px}
  td.rowhead .tmeta{font-size:11.5px; color:var(--textoSuave); margin-top:5px; display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:2px 8px; border-radius:20px;
    background:var(--azulGelo); color:var(--texto); white-space:nowrap}
  .pill.rec{background:color-mix(in srgb,var(--ambar) 20%,var(--cartao)); color:var(--ambarEsc)}
  td.cell{padding:8px; min-width:150px}
  td.cell.empty{background:repeating-linear-gradient(135deg,transparent,transparent 9px,color-mix(in srgb,var(--borda) 40%,transparent) 9px,color-mix(in srgb,var(--borda) 40%,transparent) 10px)}
  .cardstack{display:flex; flex-direction:column; gap:7px}

  .acard{--st:var(--st-wait); text-align:left; width:100%; border:1px solid var(--borda);
    border-left:4px solid var(--st); border-radius:var(--raioSm);
    background:color-mix(in srgb,var(--st) 12%, var(--cartao)); padding:9px 10px; display:block;
    transition:transform .08s ease, box-shadow .12s ease}
  .acard.readonly{opacity:.85; border-style:dashed}
  .acard:hover{transform:translateY(-1px); box-shadow:var(--sombra)}
  .acard .top{display:flex; align-items:center; gap:6px; margin-bottom:4px}
  .acard .farol{font-size:12px; line-height:1}
  .acard .st{font-size:10.5px; color:color-mix(in srgb,var(--st) 60%,var(--texto)); font-weight:600;
    text-transform:uppercase; letter-spacing:.4px}
  .acard .tg{margin-left:auto; font-size:11px; opacity:.8}
  .acard .nm{font-size:12.5px; font-weight:500; line-height:1.3; color:var(--texto)}
  .acard .due{font-size:11px; color:var(--textoSuave); margin-top:5px; display:flex; align-items:center; gap:5px; font-variant-numeric:tabular-nums}
  .acard.overdue .due{color:var(--st-rejeitada); font-weight:600}
  .acard .wait{font-size:11px; color:var(--textoSuave); font-style:italic; margin-top:4px}

  .empty-note{padding:44px 20px; text-align:center; color:var(--textoSuave)}
  .empty-note h3{font-size:16px; color:var(--texto); margin-bottom:6px}
  .empty-note p{margin:0 auto 16px; max-width:440px}

  .overlay{position:fixed; inset:0; z-index:50; background:rgba(24,36,54,.4); backdrop-filter:blur(2px);
    display:grid; place-items:center; padding:16px}
  .modal{background:var(--cartao); border:1px solid var(--borda); border-radius:var(--raio);
    box-shadow:var(--sombraModal); width:min(680px,100%); max-height:92vh; display:flex; flex-direction:column}
  .modal.wide{width:min(840px,100%)}
  .modal-head{padding:18px 20px 14px; border-bottom:1px solid var(--borda); display:flex; gap:12px; align-items:flex-start}
  .modal-head .titwrap{flex:1; min-width:0}
  .modal-head h3{font-size:17px; line-height:1.25}
  .modal-head .crumb{font-size:12px; color:var(--textoSuave); margin-bottom:5px}
  .modal-head .subt{font-size:13px; color:var(--textoSuave); margin-top:2px}
  .modal-body{padding:16px 20px; overflow-y:auto; display:flex; flex-direction:column; gap:16px}
  .modal-foot{padding:14px 20px; border-top:1px solid var(--borda); display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .modal-foot .gap{flex:1}
  .x{background:none; border:none; font-size:20px; color:var(--textoSuave); width:32px; height:32px; border-radius:8px}
  .x:hover{background:var(--azulGelo); color:var(--texto)}

  .chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:4px 11px;
    border-radius:20px; --st:var(--st-wait); background:color-mix(in srgb,var(--st) 16%,var(--cartao));
    color:color-mix(in srgb,var(--st) 62%,var(--texto)); border:1px solid color-mix(in srgb,var(--st) 34%,transparent)}

  .sec h4{font-size:11.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--textoSuave); margin-bottom:8px}
  .metagrid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px 16px}
  .metagrid .k{font-size:11px; color:var(--textoSuave); text-transform:uppercase; letter-spacing:.4px}
  .metagrid .v{font-size:13.5px; margin-top:1px}
  .banner{border-radius:var(--raioSm); padding:10px 12px; font-size:12.5px; display:flex; gap:8px; align-items:center}
  .banner.wait{background:color-mix(in srgb,var(--st-wait) 14%,var(--cartao)); color:var(--texto)}
  .banner.rej{background:color-mix(in srgb,var(--st-rejeitada) 14%,var(--cartao)); color:var(--texto)}
  .banner.info{background:color-mix(in srgb,var(--azulGelo) 60%,var(--cartao)); color:var(--texto)}

  .dados{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
  .dados .item{background:var(--fundo); border:1px solid var(--borda); border-radius:var(--raioSm); padding:8px 10px}
  .dados .item .k{font-size:10.5px; color:var(--textoSuave); text-transform:uppercase; letter-spacing:.4px; display:flex; gap:5px; align-items:center}
  .dados .item .v{font-size:13px; margin-top:2px; font-weight:500; white-space:pre-wrap; word-break:break-word}

  textarea.obs, input.val{width:100%; border:1px solid var(--bordaForte); border-radius:var(--raioSm); padding:9px 11px;
    background:var(--fundo); font-size:13px}
  textarea.obs{resize:vertical; min-height:64px; line-height:1.5; overflow:hidden}
  textarea.obs:focus, input.val:focus{outline:2px solid color-mix(in srgb,var(--azul) 40%,transparent); border-color:var(--azul)}
  .valread{background:var(--fundo); border:1px solid var(--borda); border-radius:var(--raioSm); padding:10px 12px;
    font-size:13.5px; white-space:pre-wrap; word-break:break-word; min-height:20px}
  .checkbig{display:flex; gap:10px; align-items:center; background:var(--fundo); border:1px solid var(--bordaForte);
    border-radius:var(--raioSm); padding:11px 13px; font-size:13.5px}
  .checkbig input{width:18px; height:18px; accent-color:var(--azul)}

  .evid-row{display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--borda);
    border-radius:var(--raioSm); background:var(--fundo); font-size:12.5px}
  .evid-row .fi{width:26px; height:26px; border-radius:6px; background:var(--azulGelo); display:grid; place-items:center; font-size:13px}
  .evid-row .en{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .evid-row .et{font-size:11px; color:var(--textoSuave)}
  .evid-add{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:9px}
  .req-note{font-size:11.5px; color:var(--st-rejeitada); margin-top:6px}
  .field.sm{padding:7px 9px; min-width:auto}

  ol.timeline{list-style:none; padding:0; margin:0; position:relative}
  ol.timeline li{position:relative; padding:0 0 14px 22px}
  ol.timeline li::before{content:""; position:absolute; left:5px; top:3px; width:9px; height:9px; border-radius:50%;
    background:var(--azul); box-shadow:0 0 0 3px color-mix(in srgb,var(--azul) 22%,transparent)}
  ol.timeline li::after{content:""; position:absolute; left:9px; top:12px; bottom:0; width:1px; background:var(--borda)}
  ol.timeline li:last-child::after{display:none}
  ol.timeline .tl-h{font-size:12.5px; font-weight:500}
  ol.timeline .tl-m{font-size:11px; color:var(--textoSuave); font-variant-numeric:tabular-nums}
  ol.timeline .tl-c{font-size:12px; color:var(--texto); margin-top:3px; background:var(--fundo); border-radius:8px; padding:6px 9px}

  .drawer{position:fixed; top:0; right:0; bottom:0; z-index:55; width:min(400px,92vw); background:var(--cartao);
    border-left:1px solid var(--borda); box-shadow:var(--sombraModal); display:flex; flex-direction:column;
    transform:translateX(100%); transition:transform .22s ease}
  .drawer.open{transform:none}
  .drawer-head{padding:16px 18px; border-bottom:1px solid var(--borda); display:flex; align-items:center; gap:10px}
  .drawer-head h3{font-size:15px; flex:1}
  .drawer-body{overflow-y:auto; padding:10px 14px; display:flex; flex-direction:column; gap:8px}
  .notif{display:flex; gap:10px; padding:11px 12px; border:1px solid var(--borda); border-radius:var(--raioSm); background:var(--fundo); cursor:pointer}
  .notif.unread{background:color-mix(in srgb,var(--azulGelo) 55%,var(--cartao)); border-color:var(--bordaForte)}
  .notif .nt{font-size:11px; font-weight:600; color:var(--azul); text-transform:uppercase; letter-spacing:.4px}
  .notif .nm{font-size:12.5px; margin-top:2px}
  .notif .nd{font-size:11px; color:var(--textoSuave); margin-top:3px; font-variant-numeric:tabular-nums}
  .notif .u{width:8px; height:8px; border-radius:50%; background:var(--rosa); margin-top:5px; flex-shrink:0}

  .choice{display:flex; flex-direction:column; gap:8px}
  .tmpl-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--borda); border-radius:var(--raioSm); background:var(--fundo)}
  .tmpl-row .ti{width:34px; height:34px; border-radius:9px; background:var(--azulGelo); display:grid; place-items:center; font-size:16px; flex-shrink:0}
  .tmpl-row .tn{flex:1; min-width:0}
  .tmpl-row .tn b{font-size:13.5px; font-weight:600}
  .tmpl-row .tn span{display:block; font-size:11.5px; color:var(--textoSuave)}
  .divider{display:flex; align-items:center; gap:12px; color:var(--textoSuave); font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; margin:4px 0}
  .divider::before,.divider::after{content:""; height:1px; background:var(--borda); flex:1}

  .form-row{display:flex; flex-direction:column; gap:5px}
  .form-row label{font-size:11.5px; color:var(--textoSuave); text-transform:uppercase; letter-spacing:.5px}
  .form-row input.field, .form-row select.field{width:100%; min-width:auto}
  input.field{background:var(--cartao); border:1px solid var(--bordaForte); color:var(--texto); border-radius:var(--raioSm); padding:8px 10px; font-size:13px}
  input.field:focus, select.field:focus{outline:2px solid color-mix(in srgb,var(--azul) 35%,transparent)}
  .grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
  .grid3{display:grid; grid-template-columns:1.4fr .9fr 1fr; gap:10px}
  .switch{display:inline-flex; align-items:center; gap:9px; font-size:13px; cursor:pointer}
  .switch input{width:0; height:0; opacity:0; position:absolute}
  .switch .track{width:38px; height:22px; border-radius:20px; background:var(--bordaForte); position:relative; transition:background .15s; flex-shrink:0}
  .switch .track::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input:checked + .track{background:var(--azul)}
  .switch input:checked + .track::after{transform:translateX(16px)}
  .switch input:focus-visible + .track{outline:2px solid var(--azul); outline-offset:2px}

  .fld{border:1px solid var(--borda); border-radius:var(--raioSm); background:var(--fundo); padding:11px 12px; display:flex; flex-direction:column; gap:10px}
  .fld .fld-top{display:flex; gap:10px; align-items:flex-start}
  .fld .handle{display:flex; flex-direction:column; gap:2px; padding-top:3px}
  .fld .handle button{width:22px; height:20px; border:1px solid var(--borda); background:var(--cartao); border-radius:6px; font-size:10px; color:var(--textoSuave); line-height:1; display:grid; place-items:center}
  .fld .handle button:hover:not(:disabled){border-color:var(--azul); color:var(--azul)}
  .fld .handle button:disabled{opacity:.4}
  .fld .fld-main{flex:1; min-width:0}
  .fld .fld-adv{display:flex; gap:14px; flex-wrap:wrap; align-items:center; padding-top:9px; border-top:1px dashed var(--borda)}
  .fld .chk{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--texto)}
  .fld .chk input{width:16px; height:16px; accent-color:var(--azul)}
  .fld .rmv{background:none; border:none; color:var(--textoSuave); font-size:18px; width:30px; height:30px; border-radius:8px; flex-shrink:0}
  .fld .rmv:hover{background:color-mix(in srgb,var(--st-rejeitada) 16%,var(--cartao)); color:var(--st-rejeitada)}
  .fld .mini{font-size:11px; color:var(--textoSuave); display:inline-flex; align-items:center; gap:5px}
  .fld select.field, .fld input.field{padding:7px 9px; font-size:12.5px}
  .depbox{display:flex; flex-direction:column; gap:5px; padding:9px; border:1px solid var(--borda); border-radius:8px; background:var(--cartao); margin-top:6px; width:100%}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); z-index:80;
    background:var(--texto); color:var(--fundo); padding:10px 18px; border-radius:20px; font-size:13px; font-weight:500; opacity:0; transition:all .25s ease; pointer-events:none; box-shadow:var(--sombraModal)}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  .foot{max-width:1400px; width:100%; margin:0 auto; padding:6px clamp(16px,3vw,26px) 8px; color:var(--textoSuave); font-size:11.5px; display:flex; gap:14px; flex-wrap:wrap; align-items:center}
  .banner-proto{max-width:1400px; margin:14px auto 0; padding:9px clamp(16px,3vw,26px);}

    + `<span class="sub">Departamento Pessoal · Grupo Coroa</span>`;

/* ---- seed: apenas equipe ---- */
function seed(){
  const sol = [
    {id:"u_sofia", nome:"Sofia Prado", funcao:"Gestora de DP",         perfil:"Gestor",       coluna:false, ativo:true},
    {id:"u_paulo", nome:"Paulo Nunes", funcao:"Coordenador (Criador)",  perfil:"Criador",      coluna:false, ativo:true},
    {id:"u_ana",   nome:"Ana Lima",    funcao:"Analista de DP",         perfil:"Solucionador", coluna:true,  ativo:true},
    {id:"u_bruno", nome:"Bruno Alves", funcao:"Analista de Folha",      perfil:"Solucionador", coluna:true,  ativo:true},
    {id:"u_carla", nome:"Carla Dias",  funcao:"Analista de Benefícios", perfil:"Solucionador", coluna:true,  ativo:true},
    {id:"u_diego", nome:"Diego Rocha", funcao:"TI / Acessos",           perfil:"Solucionador", coluna:true,  ativo:true},
    {id:"u_elena", nome:"Elena Souza", funcao:"Business Partner",       perfil:"Solucionador", coluna:true,  ativo:true},
  ];
  return {sol, modelos:[], tarefas:[], itens:[], hist:[], notifs:[], ui:{userId:"u_sofia"}};
}
let db;
function load(){ try{ const r=localStorage.getItem(KEY); db=r?JSON.parse(r):seed(); }catch(e){ db=seed(); }
  ["modelos","tarefas","itens","hist","notifs"].forEach(k=>{ if(!db[k]) db[k]=[]; }); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
function reset(){ db=seed(); save(); closeAll(); render(); toast("Tudo limpo — comece criando uma tarefa"); }

const me = ()=> db.sol.find(s=>s.id===db.ui.userId);
const solById = id=> db.sol.find(s=>s.id===id) || {nome:"—",id};
const tarById = id=> db.tarefas.find(t=>t.id===id);
const itemById = id=> db.itens.find(a=>a.id===id);
const isGestor = ()=> me().perfil==="Gestor";
const isCriador = ()=> me().perfil==="Criador" || isGestor();
const itensDaTarefa = tid=> db.itens.filter(a=>a.tarefaId===tid).sort((x,y)=>x.ordem-y.ordem);
const tLabel = t=> t.subtitulo? `${t.nome} · ${t.subtitulo}` : t.nome;

/* ---- permissões (UI) ---- */
function ehEditorItem(a){ return !!a.responsavel && (a.responsavel===db.ui.userId || isGestor()); }
function podeEditarValor(a){ return ehEditorItem(a) && [S.LIB,S.EXEC].includes(a.status); }
function podeVerItem(a){ if(!a.responsavel) return true; if(isGestor()||isCriador()) return true;
  if(a.responsavel===db.ui.userId) return true; return !!a.visivelTodos; }

/* ---- transições ---- */
function logHist(a,de,para,c){ db.hist.push({acaoId:a.id, usuario:db.ui.userId, dataHora:iso(new Date()), de, para, comentario:c||""}); }
function notify(destId,acaoId,tipo,msg){ if(!destId) return; db.notifs.push({id:uid("n"), destId, acaoId, tipo, msg, lida:false, dataHora:iso(new Date())}); }
function setStatus(a,novo,c){ const de=a.status; a.status=novo; logHist(a,de,novo,c); }
function depsDe(a){ return (a.depIds||[]).map(itemById).filter(Boolean); }
function reavaliarLiberacoes(){
  db.itens.filter(x=>x.responsavel && x.status===S.WAIT).forEach(x=>{
    const deps=depsDe(x);
    if(deps.length && deps.every(d=>d.status===S.ENC)){
      setStatus(x,S.LIB,"Liberada — todas as etapas anteriores concluídas");
      notify(x.responsavel, x.id, "Liberada", `Sua etapa "${x.rotulo}" foi liberada.`);
    }
  });
}
function recalcTarefa(tid){ const t=tarById(tid); const exec=db.itens.filter(a=>a.tarefaId===tid && a.responsavel);
  if(exec.length && exec.every(a=>a.status===S.ENC)) t.statusGeral="Concluída";
  else if(!exec.length) t.statusGeral="Registro"; else t.statusGeral="Em andamento"; }
function faltaPreencher(a){
  if(tipoPrecisaValor(a.tipo) && !String(a.valor||"").trim()) return "Preencha o valor do campo.";
  if(a.tipo==="Check" && a.valor!==true) return "Marque a confirmação (Check).";
  if((a.tipo==="Evidência" || a.exigeEvid) && a.evidencias.length===0) return "Anexe ao menos uma evidência.";
  return null;
}
function actIniciar(a){ setStatus(a,S.EXEC,"Iniciada"); commit(); toast("Etapa em execução"); }
function actConcluirOuEnviar(a){
  const f=faltaPreencher(a); if(f){ toast(f); return; }
  if(a.exigeAprov){ a.enviadoEm=iso(new Date()); setStatus(a,S.VAL,"Enviada para validação do gestor");
    notify(tarById(a.tarefaId).gestor, a.id, "Enviada p/ validação", `"${a.rotulo}" aguarda validação.`);
    commit(); toast("Enviada para validação");
  } else { setStatus(a,S.ENC,"Concluída (sem aprovação necessária)"); reavaliarLiberacoes(); recalcTarefa(a.tarefaId);
    notify(tarById(a.tarefaId).gestor, a.id, "Encerrada", `"${a.rotulo}" foi concluída.`); commit(); toast("Etapa concluída"); }
}
function actValidar(a){ a.decididoPor=db.ui.userId; setStatus(a,S.ENC,"Validada e encerrada pelo gestor");
  notify(a.responsavel, a.id, "Encerrada", `Sua etapa "${a.rotulo}" foi validada e encerrada.`);
  reavaliarLiberacoes(); recalcTarefa(a.tarefaId); commit(); toast("Etapa encerrada"); }
function actRejeitar(a,just){ if(!just||!just.trim()){ toast("Justificativa obrigatória."); return; }
  a.decididoPor=db.ui.userId; a.just=just.trim(); setStatus(a,S.REJ,"Rejeitada: "+a.just);
  notify(a.responsavel, a.id, "Rejeitada", `"${a.rotulo}" foi devolvida. Motivo: ${a.just}`); commit(); toast("Etapa rejeitada e devolvida"); }
function actReabrir(a){ setStatus(a,S.EXEC,"Reaberta para correção após rejeição"); commit(); toast("Etapa reaberta"); }
function commit(){ save(); render(); if(openItemId) renderItem(openItemId); else if(openTaskId) renderTask(openTaskId); refreshBell(); }

/* ---- render topo/matriz ---- */
function render(){ renderUserSelect(); renderLegend(); renderMatrix(); refreshBell(); }
function renderUserSelect(){ const sel=$("#usersel"); sel.innerHTML="";
  db.sol.filter(s=>s.ativo).forEach(s=>{ const o=el("option",null,`${s.nome} · ${s.perfil}`); o.value=s.id; if(s.id===db.ui.userId)o.selected=true; sel.appendChild(o); }); }
function renderLegend(){ const lg=$("#legend"); lg.innerHTML="";
  [S.WAIT,S.LIB,S.EXEC,S.VAL,S.ENC,S.REJ].forEach(st=>{ const m=STMETA[st]; const s=el("span"); s.append(document.createTextNode(m.emoji+" "), el("span",null,m.short)); lg.appendChild(s); }); }
function visibleColumns(){ let c=db.sol.filter(s=>s.coluna&&s.ativo); if(!isCriador()) c=c.filter(x=>x.id===db.ui.userId); return c; }
function visibleTarefas(){ if(isCriador()) return db.tarefas;
  return db.tarefas.filter(t=> db.itens.some(a=>a.tarefaId===t.id && a.responsavel===db.ui.userId)); }
function renderMatrix(){
  const u=me();
  $("#boardTitle").textContent = isCriador()? "Painel geral" : "Minhas etapas";
  const cols=visibleColumns(), rows=visibleTarefas();
  const tb=$("#matrix"); tb.innerHTML="";
  const thead=el("thead"), htr=el("tr");
  const corner=el("th","corner");
  corner.append(el("div",null,"Tarefa"),(()=>{const s=el("span");s.style.cssText="font-size:11px;color:var(--textoSuave);font-weight:500;display:block";s.textContent="tarefa × solucionador";return s;})());
  htr.appendChild(corner);
  cols.forEach(c=>{ const th=el("th"); th.append(el("div",null,c.nome), el("span","fx",c.funcao)); htr.appendChild(th); });

/* ---- construtor ---- */
function novoCampo(ordem){ return {ordem, rotulo:"", tipo:"Texto", responsavel:"", exigeAprov:false, obrig:false, exigeEvid:false, visivelTodos:false, prazoRel:0, depOrdens:[], valorInicial:""}; }
function modeloFromTarefa(t){
  const itens=itensDaTarefa(t.id).map(a=>({ordem:a.ordem, rotulo:a.rotulo, tipo:a.tipo, responsavel:a.responsavel,
    exigeAprov:a.exigeAprov, obrig:a.obrig, exigeEvid:a.exigeEvid, visivelTodos:!!a.visivelTodos, prazoRel:a.prazoRel||0, depOrdens:(a.depOrdens||[]).slice(), valorInicial:""}));
  return {id:t.modeloId||null, nome:t.nome, itens};
}
function openBuilder(modelo){
  const root=$("#root"); root.innerHTML="";
  const st={ modeloId: modelo? modelo.id : null, nome:"", subtitulo:"", recorrente:!!modelo, dataRef:fmtISOdate(today()),
    campos: modelo ? modelo.itens.map((c,i)=>({...novoCampo(i+1), ...c, ordem:i+1, depOrdens:(c.depOrdens||[]).slice(), valorInicial:""})) : [ novoCampo(1) ] };
  const ov=overlay(()=>root.innerHTML=""), mod=el("div","modal wide"), head=el("div","modal-head");
  head.append((()=>{const w=el("div","titwrap");w.append(el("div","crumb", modelo?`Modelo: ${modelo.nome}`:"Do zero"), el("h3",null, modelo?"Nova ocorrência":"Criar tarefa"));return w;})());
  const x=el("button","x","×"); x.onclick=()=>root.innerHTML=""; head.appendChild(x);
  const body=el("div","modal-body"), foot=el("div","modal-foot");
  mod.append(head,body,foot); ov.appendChild(mod); root.appendChild(ov);

  function reordenar(){ st.campos.forEach((c,i)=>c.ordem=i+1); }
  function sanitizeDeps(){ const validas=new Set(); st.campos.forEach(c=>{ if(c.responsavel && c.rotulo.trim()) validas.add(c.ordem); });
    st.campos.forEach(c=>{ c.depOrdens=(c.depOrdens||[]).filter(o=> o<c.ordem && validas.has(o)); }); }

  function chk(label,val,onset){ const l=el("label","chk"); const cb=el("input"); cb.type="checkbox"; cb.checked=!!val; cb.onchange=()=>onset(cb.checked); l.append(cb, el("span",null,label)); return l; }

  function depControl(campo){
    const cand=st.campos.filter(c=>c.ordem<campo.ordem && c.responsavel && c.rotulo.trim());
    if(!cand.length) return null;
    const wrap=el("div"); wrap.style.width="100%";
    const btn=el("button","btn ghost sm");
    const label=()=> "⛓ Depende de: "+(campo.depOrdens.length? campo.depOrdens.length+" selecionada(s)":"nenhuma");
    btn.textContent=label();
    const panel=el("div","depbox"); panel.hidden=true;
    cand.forEach(d=>{ const l=el("label","chk"); const cb=el("input"); cb.type="checkbox"; cb.checked=campo.depOrdens.includes(d.ordem);
      cb.onchange=()=>{ if(cb.checked){ if(!campo.depOrdens.includes(d.ordem)) campo.depOrdens.push(d.ordem); } else campo.depOrdens=campo.depOrdens.filter(o=>o!==d.ordem); btn.textContent=label(); };
      l.append(cb, el("span",null,`#${d.ordem} ${d.rotulo||"(sem nome)"}`)); panel.appendChild(l); });
    btn.onclick=e=>{ e.preventDefault(); panel.hidden=!panel.hidden; };
    wrap.append(btn,panel); return wrap;
  }

  function drawItens(container){
    sanitizeDeps(); container.innerHTML="";
    st.campos.forEach((c,idx)=>{
      const box=el("div","fld"), top=el("div","fld-top"), h=el("div","handle");
      const up=el("button",null,"▲"); up.title="Subir"; up.disabled=idx===0; up.onclick=()=>{ [st.campos[idx-1],st.campos[idx]]=[st.campos[idx],st.campos[idx-1]]; reordenar(); drawItens(container); };
      const dn=el("button",null,"▼"); dn.title="Descer"; dn.disabled=idx===st.campos.length-1; dn.onclick=()=>{ [st.campos[idx+1],st.campos[idx]]=[st.campos[idx],st.campos[idx+1]]; reordenar(); drawItens(container); };
      h.append(up,dn); top.appendChild(h);

      const main=el("div","fld-main"), g=el("div","grid3");
      const rl=el("div","form-row"); rl.append(el("label",null,"Campo #"+c.ordem)); const ri=el("input","field"); ri.placeholder="Nome do campo"; ri.value=c.rotulo; ri.oninput=()=>c.rotulo=ri.value; rl.appendChild(ri); g.appendChild(rl);
      const tl=el("div","form-row"); tl.append(el("label",null,"Tipo")); const ts=el("select","field"); TIPOS.forEach(tp=>{const o=el("option",null,TIPOICON[tp]+" "+tp);o.value=tp;if(tp===c.tipo)o.selected=true;ts.appendChild(o);}); ts.onchange=()=>{ c.tipo=ts.value; if(c.tipo==="Evidência") c.exigeEvid=true; drawItens(container); }; tl.appendChild(ts); g.appendChild(tl);
      const sl=el("div","form-row"); sl.append(el("label",null,"Responsável")); const ss=el("select","field"); const on=el("option",null,"— Dado (sem responsável)"); on.value=""; ss.appendChild(on);
      db.sol.filter(s=>s.coluna&&s.ativo).forEach(s=>{const o=el("option",null,s.nome);o.value=s.id;if(s.id===c.responsavel)o.selected=true;ss.appendChild(o);}); ss.value=c.responsavel;
      ss.onchange=()=>{ c.responsavel=ss.value; if(!c.responsavel){ c.exigeAprov=false; c.visivelTodos=false; c.depOrdens=[]; } drawItens(container); }; sl.appendChild(ss); g.appendChild(sl);
      main.appendChild(g);

      if(!c.responsavel && c.tipo!=="Evidência"){
        const vw=el("div","form-row"); vw.style.marginTop="8px"; vw.append(el("label",null,"Valor (opcional)"));
        if(c.tipo==="Check"){ const l=el("label","chk"); const cb=el("input"); cb.type="checkbox"; cb.checked=c.valorInicial===true; cb.onchange=()=>c.valorInicial=cb.checked; l.append(cb,el("span",null,"Confirmado")); vw.appendChild(l); }
        else if(tipoTextoLongo(c.tipo)){ const ta=el("textarea","obs"); ta.rows=2; ta.value=c.valorInicial||""; ta.oninput=()=>{c.valorInicial=ta.value; autogrow(ta);}; vw.appendChild(ta); setTimeout(()=>autogrow(ta),0); }
        else { const i=el("input","field"); i.type=c.tipo==="Data"?"date":c.tipo==="Número"?"number":"text"; i.value=c.valorInicial||""; i.oninput=()=>c.valorInicial=i.value; vw.appendChild(i); }
        main.appendChild(vw);
      }
      top.appendChild(main);
      const rm=el("button","rmv","×"); rm.title="Remover campo"; rm.onclick=()=>{ st.campos.splice(idx,1); if(!st.campos.length) st.campos.push(novoCampo(1)); reordenar(); drawItens(container); }; top.appendChild(rm);
      box.appendChild(top);

      const adv=el("div","fld-adv");
      adv.appendChild(chk("Obrigatório", c.obrig, v=>c.obrig=v));
      if(c.tipo!=="Evidência") adv.appendChild(chk("Exige evidência", c.exigeEvid, v=>c.exigeEvid=v));
      else adv.appendChild(el("span","mini","📎 Evidência é o próprio anexo"));
      if(c.responsavel){
        adv.appendChild(chk("Aprovação do gestor", c.exigeAprov, v=>c.exigeAprov=v));
        adv.appendChild(chk("👁 Visível a todos", c.visivelTodos, v=>c.visivelTodos=v));
        const pw=el("span","mini"); pw.append(document.createTextNode("Prazo D")); const pi=el("input","field"); pi.type="number"; pi.value=c.prazoRel; pi.style.width="62px"; pi.title="Dias relativos ao D+0 (ex.: -3, 0, 2)"; pi.oninput=()=>c.prazoRel=parseInt(pi.value||"0",10); pw.appendChild(pi); adv.appendChild(pw);
        const dc=depControl(c); if(dc) adv.appendChild(dc);
      }
      box.appendChild(adv); container.appendChild(box);
    });
  }

  function draw(){
    body.innerHTML=""; foot.innerHTML="";
    const s0=el("div","sec"); s0.appendChild(el("h4",null,"Tarefa"));
    const gt=el("div","grid2");
    gt.appendChild(field("Título",(()=>{const i=el("input","field");i.placeholder="Ex.: Demissão";i.value=st.nome;i.oninput=()=>st.nome=i.value;return i;})()));
    gt.appendChild(field("Subtítulo",(()=>{const i=el("input","field");i.placeholder="Ex.: Fulano de Tal";i.value=st.subtitulo;i.oninput=()=>st.subtitulo=i.value;return i;})()));
    s0.appendChild(gt);
    const g=el("div","grid2");
    g.appendChild(field("Data de referência (D+0)",(()=>{const i=el("input","field");i.type="date";i.value=st.dataRef;i.onchange=()=>st.dataRef=i.value;return i;})()));
    const recWrap=el("div","form-row"); recWrap.append(el("label",null,"Recorrente"));
    const sw=el("label","switch"); const si=el("input"); si.type="checkbox"; si.checked=st.recorrente; si.onchange=()=>st.recorrente=si.checked; sw.append(si, el("span","track"), el("span",null,"Salvar como modelo reutilizável")); recWrap.appendChild(sw);
    g.appendChild(recWrap); s0.appendChild(g); body.appendChild(s0);

    const s1=el("div","sec");
    const hh=el("div"); hh.style.cssText="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px";
    hh.append(el("h4",null,"Campos e etapas"), (()=>{const b=el("button","btn ghost sm","＋ Adicionar campo");b.onclick=()=>{st.campos.push(novoCampo(st.campos.length+1));drawItens(itensBox);};return b;})());
    s1.appendChild(hh);
    s1.appendChild(el("div","et")).textContent="Campos sem responsável são “dados” compartilhados. Com responsável viram etapas na matriz (o gestor é sempre coeditor). Marque evidência, aprovação, visibilidade e dependências por campo.";
    const itensBox=el("div"); itensBox.style.cssText="display:flex;flex-direction:column;gap:10px;margin-top:10px"; s1.appendChild(itensBox); body.appendChild(s1);
    drawItens(itensBox);

    foot.appendChild(el("div","gap"));
    const cancel=el("button","btn ghost","Cancelar"); cancel.onclick=()=>root.innerHTML="";
    const create=el("button","btn primary", modelo?"Criar ocorrência":"Criar tarefa"); create.onclick=()=>criar(st);
    foot.append(cancel,create);
  }
  draw();
}
function field(label,control){ const w=el("div","form-row"); w.append(el("label",null,label), control); return w; }

function criar(st){
  if(!st.nome.trim()){ toast("Informe o título da tarefa."); return; }
  const validos=st.campos.filter(c=>c.rotulo.trim());
  if(!validos.length){ toast("Adicione ao menos um campo com nome."); return; }
  const ref=new Date(st.dataRef+"T00:00:00"), tId=uid("t");
  const gestor=db.sol.find(s=>s.perfil==="Gestor")?.id || db.ui.userId;
  db.tarefas.push({id:tId, nome:st.nome.trim(), subtitulo:(st.subtitulo||"").trim(), recorrente:st.recorrente, modeloId:st.modeloId||null,
    dataRef:iso(ref), criador:db.ui.userId, gestor, statusGeral:"Em andamento"});

  // ordem final (1..n) por posição
  const validosOrd = validos.map((c,i)=>({...c, ordemFinal:i+1, ordemOrig:c.ordem}));
  const origToFinal={}; validosOrd.forEach(c=> origToFinal[c.ordemOrig]=c.ordemFinal);
  const finalToId={};
  validosOrd.forEach(c=>{
    const aId=uid("a"); finalToId[c.ordemFinal]=aId;
    const temResp=!!c.responsavel; const exigeEvid=c.tipo==="Evidência"?true:!!c.exigeEvid;
    const depOrdensFinais=(c.depOrdens||[]).map(o=>origToFinal[o]).filter(o=>o && o<c.ordemFinal);
    db.itens.push({id:aId, tarefaId:tId, ordem:c.ordemFinal, rotulo:c.rotulo.trim(), tipo:c.tipo,
      responsavel:c.responsavel||"", exigeAprov: temResp && !!c.exigeAprov, obrig:!!c.obrig, exigeEvid,
      visivelTodos: temResp && !!c.visivelTodos, prazo: temResp? iso(addDays(ref,c.prazoRel||0)):null, prazoRel:c.prazoRel||0,
      depIds:[], depOrdens:depOrdensFinais, status: temResp? (depOrdensFinais.length? S.WAIT : S.LIB) : S.DADO,
      valor: temResp? (c.tipo==="Check"?false:"") : (c.tipo==="Check"? c.valorInicial===true : (c.valorInicial||"")),
      evidencias:[], obs:"", just:"", enviadoEm:null, decididoPor:null});
  });
  db.itens.filter(a=>a.tarefaId===tId).forEach(a=>{
    a.depIds=(a.depOrdens||[]).map(o=>finalToId[o]).filter(Boolean);
    if(a.responsavel){ logHist(a,"—",a.status,"Etapa distribuída na criação da tarefa");
      if(a.status===S.LIB) notify(a.responsavel, a.id, "Atribuída", `Nova etapa: "${a.rotulo}" (prazo ${fmtD(a.prazo)}).`); }
  });
  recalcTarefa(tId);

  if(st.recorrente){
    const estrut=validosOrd.map(c=>({ordem:c.ordemFinal, rotulo:c.rotulo.trim(), tipo:c.tipo, responsavel:c.responsavel||"",
      exigeAprov:!!c.exigeAprov, obrig:!!c.obrig, exigeEvid:(c.tipo==="Evidência"||!!c.exigeEvid), visivelTodos:!!c.visivelTodos, prazoRel:c.prazoRel||0,
      depOrdens:(c.depOrdens||[]).map(o=>origToFinal[o]).filter(Boolean)}));
    let mo=st.modeloId && db.modelos.find(m=>m.id===st.modeloId);
    if(mo){ mo.itens=estrut; mo.nome=st.nome.trim(); }
    else { mo={id:uid("m"), nome:st.nome.trim(), itens:estrut}; db.modelos.push(mo); db.tarefas.find(t=>t.id===tId).modeloId=mo.id; }
  }
  save(); $("#root").innerHTML=""; render(); toast("Tarefa criada e etapas distribuídas");
}

/* ---- notificações ---- */
function myNotifs(){ return db.notifs.filter(n=>n.destId===db.ui.userId).sort((a,b)=> new Date(b.dataHora)-new Date(a.dataHora)); }
function refreshBell(){ const unread=myNotifs().filter(n=>!n.lida).length; const dot=$("#belldot"); if(unread>0){ dot.hidden=false; dot.textContent=unread>9?"9+":unread; } else dot.hidden=true; }
function openDrawer(){
  let dr=$("#drawer"); if(dr) dr.remove(); dr=el("div","drawer"); dr.id="drawer";
  const head=el("div","drawer-head"); head.append(el("h3",null,"Notificações"));
  const mark=el("button","btn subtle","Marcar todas lidas"); mark.onclick=()=>{ myNotifs().forEach(n=>n.lida=true); save(); refreshBell(); openDrawer(); };
  const cx=el("button","x","×"); cx.onclick=()=>dr.classList.remove("open"); head.append(mark,cx);
  const body=el("div","drawer-body"); const list=myNotifs();
  if(!list.length) body.appendChild(el("div","empty-note","Nenhuma notificação."));
  list.forEach(n=>{ const c=el("div","notif"+(n.lida?"":" unread")); if(!n.lida) c.appendChild(el("div","u"));
    const wrap=el("div"); wrap.style.flex="1"; wrap.append(el("div","nt",n.tipo), el("div","nm",n.msg), el("div","nd",fmtDT(n.dataHora))); c.appendChild(wrap);
    c.onclick=()=>{ n.lida=true; save(); refreshBell(); if(n.acaoId && itemById(n.acaoId)){ dr.classList.remove("open"); openItem(n.acaoId); } else openDrawer(); };
    body.appendChild(c); });
  dr.append(head,body); document.body.appendChild(dr); requestAnimationFrame(()=>dr.classList.add("open"));
}

/* ---- tema/toast/eventos ---- */
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }
function toggleTheme(){ const cur=document.documentElement.getAttribute("data-theme"); const prefersDark=matchMedia("(prefers-color-scheme: dark)").matches; let next;
  if(cur==="dark") next="light"; else if(cur==="light") next="dark"; else next=prefersDark?"light":"dark";
  document.documentElement.setAttribute("data-theme",next); try{ localStorage.setItem("painelCora_theme",next); }catch(e){} }
(function initTheme(){ try{ const s=localStorage.getItem("painelCora_theme"); if(s) document.documentElement.setAttribute("data-theme",s); }catch(e){} })();
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ if($("#root").innerHTML) closeAll(); const dr=$("#drawer"); if(dr) dr.classList.remove("open"); } });

load(); injectLogos(); render();
$("#usersel").onchange=e=>{ db.ui.userId=e.target.value; save(); closeAll(); render(); };
$("#novaBtn").onclick=openNova;
$("#bell").onclick=openDrawer;
$("#themebtn").onclick=toggleTheme;
$("#resetBtn").onclick=()=>{ if(confirm("Limpar todas as tarefas, modelos e notificações?")) reset(); };
</script>
